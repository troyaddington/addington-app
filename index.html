<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addington Hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2c3a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Addington Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192_1.png">
<style>
  :root { --bg:#f7ecdd; --card:#fffaf2; --ink:#2a2115; --muted:#6b5a47; --line:#e8d6bf; --brand:#2c3a26; --accent:#b5551b; --danger:#a3281d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .gatelogo { width:104px; height:104px; border-radius:24px; justify-self:center; box-shadow:0 6px 18px rgba(42,33,21,.3); }
  header { background:linear-gradient(100deg, #2c3a26 0%, #4a3a22 58%, #b5551b 100%); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font:600 21px/1.2 Georgia, "Times New Roman", serif; margin:0; flex:1; }
  header button { background:none; border:0; color:#fff; font:inherit; padding:6px 0; min-height:44px; cursor:pointer; }
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 14px; text-align:left; font:inherit; color:inherit; min-height:112px; cursor:pointer; }
  .tile b { display:block; font-size:18px; margin-bottom:4px; }
  .tile span { color:var(--muted); font-size:14px; }
  .tile[disabled] { opacity:.6; cursor:default; }
  .day { font:600 15px/1.2 Georgia, "Times New Roman", serif; color:var(--brand); margin:18px 2px 8px; }
  .ev { display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 14px; font:inherit; color:inherit; cursor:pointer; min-height:56px; }
  li.evrow { padding:0; display:block; border-top:0; }
  .ev small { display:block; color:var(--muted); font-size:14px; overflow-wrap:anywhere; }
  .ev .when { color:var(--accent); font-size:14px; font-weight:600; display:block; }
  .rowbtns { display:flex; gap:8px; margin-bottom:6px; }
  .rowbtns .btn { flex:1; }
  .btn.soft { background:var(--card); color:var(--brand); border:1px solid var(--line); }
  .evform { display:grid; gap:10px; }
  .evform label { display:grid; gap:4px; color:var(--muted); font-size:14px; }
  .evform .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .evform .check { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:16px; min-height:44px; }
  .evform .check input { width:24px; height:24px; min-height:0; accent-color:var(--brand); }
  textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); min-height:84px; resize:vertical; }
  input[type=date], input[type=time] { -webkit-appearance:none; appearance:none; min-width:0; }
  form.add { display:grid; grid-template-columns:1fr 84px 56px; gap:8px; margin-bottom:14px; }
  input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); min-height:48px; }
  .btn { font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; padding:12px 16px; min-height:48px; cursor:pointer; }
  .btn.quiet { background:none; color:var(--danger); font-weight:500; padding:10px 0; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  ul:empty { display:none; }
  li { display:flex; align-items:center; gap:10px; padding:4px 6px 4px 14px; border-top:1px solid var(--line); min-height:56px; }
  li:first-child { border-top:0; }
  li input[type=checkbox] { width:24px; height:24px; min-height:0; flex:none; accent-color:var(--brand); }
  li label { flex:1; padding:10px 0; cursor:pointer; overflow-wrap:anywhere; }
  li small { display:block; color:var(--muted); font-size:13px; }
  li.done label { color:var(--muted); text-decoration:line-through; }
  li button { background:none; border:0; color:var(--muted); font-size:22px; width:44px; height:44px; cursor:pointer; }
  .gate { max-width:360px; margin:9vh auto 0; display:grid; gap:12px; }
  .gate h2 { font:600 26px/1.2 Georgia, "Times New Roman", serif; margin:0; color:var(--brand); }
  .gate p { margin:0; color:var(--muted); }
  .note { color:var(--muted); text-align:center; padding:24px 8px; }
  .err { color:var(--danger); min-height:1.4em; font-size:15px; margin:0; }
  li.pending label { opacity:.6; }
  .err:empty { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Back to home">‹ Home</button>
  <h1 id="title">Addington App</h1>
</header>
<main id="main"></main>

<script src="hub.js"></script>
<script>
// Paste the deployed Apps Script web app URL here.
const API_URL = 'https://script.google.com/macros/s/AKfycbw5WMXFqKbHFmhxtV2MFHCqTr8zJO94zdutdqH5eBPlKNISalXWB3PEdq12bFh_5U5PXw/exec';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let token = store.get('token');
let items = [];
let view = 'home';
let events = [];
let feed = '';
let listKind = '';
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const titleEl = document.getElementById('title');

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token }, data || {}))
  });
  const out = await res.json();
  if (!out.ok && out.error === 'auth') { store.del('token'); token = null; showGate(); }
  return out;
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  kids.forEach(k => n.append(k));
  return n;
}

function setView(name, title) {
  view = name;
  titleEl.textContent = title;
  backBtn.hidden = name === 'home' || name === 'gate';
  main.replaceChildren();
}

async function showGate() {
  setView('gate', 'Addington App');
  const note = el('p', { className: 'note', textContent: 'Loading…' });
  main.append(note);
  let hasPasscode = true;
  try { hasPasscode = (await api('status')).hasPasscode; }
  catch (e) { note.textContent = 'Could not connect. Check your signal and try again.'; return; }
  main.replaceChildren();

  const name = el('input', { placeholder: 'Your first name', autocomplete: 'given-name', value: store.get('name') || '', required: true });
  const pass = el('input', { type: 'password', placeholder: hasPasscode ? 'Family passcode' : 'Choose a family passcode', autocomplete: 'off', required: true, minLength: 6 });
  const err = el('p', { className: 'err' });
  const btn = el('button', { className: 'btn', type: 'submit', textContent: hasPasscode ? 'Open' : 'Create passcode' });
  const form = el('form', { className: 'gate' },
    el('img', { className: 'gatelogo', src: 'icon-192_1.png', alt: 'Addington family' }),
    el('h2', { textContent: hasPasscode ? 'Welcome home' : 'Set up your family app' }),
    el('p', { textContent: hasPasscode ? 'Enter the family passcode.' : 'Pick a passcode of at least 6 characters. Everyone in the family will use it.' }),
    name, pass, err, btn);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const out = await api(hasPasscode ? 'login' : 'setup', { passcode: pass.value });
      if (out.ok) {
        token = out.token;
        store.set('token', token);
        store.set('name', name.value.trim());
        showHome();
        return;
      }
      err.textContent = { wrong: 'That passcode is not right.', locked: 'Too many tries. Wait 15 minutes.', too_short: 'Use at least 6 characters.', already_set: 'A passcode already exists. Reload and enter it.' }[out.error] || 'Something went wrong. Try again.';
    } catch (e) { err.textContent = 'Could not connect. Try again.'; }
    btn.disabled = false;
  });
  main.append(form);
}

function showHome() {
  setView('home', 'Addington App');
  const tile = (t, s, fn) => el('button', { className: 'tile', disabled: !fn, onclick: fn || null }, el('b', { textContent: t }), el('span', { textContent: s }));
  main.append(el('div', { className: 'attn', id: 'attn' }), el('div', { className: 'tiles' },
    tile('Grocery list', 'Shared with everyone', showGrocery),
    tile('Calendar', 'Everything coming up', () => showEvents('event')),
    tile('Appointments', 'Doctors and visits', () => showEvents('appointment')),
    tile('Pets', 'Profiles and vaccinations', petsList),
    tile('Vehicles', 'Insurance and registration', vehiclesList)));
  hubHome();
}

const pad = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const localDay = s => new Date(s + 'T12:00:00');
const evDay = e => e.allDay ? e.start : dayKey(new Date(e.start));
const fmtTime = s => new Date(s).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = s => {
  const d = localDay(s), now = new Date();
  const tom = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  if (s === dayKey(now)) return 'Today';
  if (s === dayKey(tom)) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
};

async function loadEvents() {
  const now = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const to = new Date(from.getTime() + 366 * 864e5);
  const out = await api('cal.list', { from: from.toISOString(), to: to.toISOString() });
  if (out.ok) { events = out.events; feed = out.feed || ''; }
  return out;
}

async function showEvents(kind) {
  listKind = kind;
  setView('events', kind === 'appointment' ? 'Appointments' : 'Calendar');
  const add = el('button', { className: 'btn', textContent: kind === 'appointment' ? 'Add appointment' : 'Add event' });
  add.addEventListener('click', () => showEventForm(kind));
  const btns = el('div', { className: 'rowbtns' }, add);
  const box = el('div', { id: 'evlist' }, el('p', { className: 'note', textContent: 'Loading…' }));
  main.append(btns, el('p', { className: 'err', id: 'gerr', role: 'alert' }), box);
  renderEvents();
  try {
    const out = await loadEvents();
    if (view !== 'events' || listKind !== kind) return;
    if (!out.ok) { if (out.error !== 'auth') { box.replaceChildren(); showErr('Could not load the calendar (' + out.error + ').'); } return; }
    if (feed && kind === 'event') btns.append(el('a', { className: 'btn soft', href: feed, textContent: 'Add to iPhone', style: 'text-align:center;text-decoration:none' }));
    renderEvents(true);
  } catch (e) { if (view === 'events') { box.replaceChildren(); showErr('Could not load the calendar. Check your signal and try again.'); } }
}

function renderEvents(loaded) {
  const box = document.getElementById('evlist');
  if (!box || (!loaded && !events.length)) return;
  const shown = events.filter(e => listKind === 'event' || e.kind === 'appointment');
  if (!shown.length) { box.replaceChildren(el('p', { className: 'note', textContent: listKind === 'appointment' ? 'No appointments coming up.' : 'Nothing on the calendar yet.' })); return; }
  const nodes = []; let last = '', ul = null;
  shown.forEach(e => {
    const day = evDay(e);
    if (day !== last) { last = day; ul = el('ul'); nodes.push(el('p', { className: 'day', textContent: fmtDay(day) }), ul); }
    const b = el('button', { className: 'ev' });
    b.append(el('span', { className: 'when', textContent: e.allDay ? 'All day' : fmtTime(e.start) + ' – ' + fmtTime(e.end) }), e.title || '(No title)');
    const sub = e.kind === 'appointment' ? [e.reason, e.location].filter(Boolean).join(' · ') : e.location;
    if (sub) b.append(el('small', { textContent: sub }));
    b.addEventListener('click', () => showEventForm(e.kind === 'appointment' ? 'appointment' : 'event', e));
    ul.append(el('li', { className: 'evrow' }, b));
  });
  box.replaceChildren(...nodes);
}

function showEventForm(kind, ev) {
  const appt = kind === 'appointment';
  setView('form', (ev ? 'Edit ' : 'New ') + (appt ? 'appointment' : 'event'));
  const now = new Date();
  const startD = ev && !ev.allDay ? new Date(ev.start) : null, endD = ev && !ev.allDay ? new Date(ev.end) : null;
  const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const field = (label, control) => el('label', {}, label, control);
  const text = (val, max) => el('input', { value: val || '', maxLength: max || 200 });
  const title = text(ev && ev.title), person = text(ev && ev.person, 60), doctor = text(ev && ev.doctor, 120), reason = text(ev && ev.reason, 300), location_ = text(ev && ev.location, 300);
  const notes = el('textarea', { value: (ev && ev.notes) || '', maxLength: 2000 });
  const date = el('input', { type: 'date', required: true, value: ev ? evDay(ev) : dayKey(now) });
  const start = el('input', { type: 'time', value: startD ? hhmm(startD) : '09:00' });
  const end = el('input', { type: 'time', value: endD ? hhmm(endD) : '10:00' });
  const allDay = el('input', { type: 'checkbox', checked: !!(ev && ev.allDay) });
  const times = el('div', { className: 'two', hidden: allDay.checked }, field('Start', start), field('End', end));
  allDay.addEventListener('change', () => { times.hidden = allDay.checked; });
  start.addEventListener('change', () => { if (end.value <= start.value) { const [h, m] = start.value.split(':').map(Number); end.value = pad(Math.min(h + 1, 23)) + ':' + pad(m); } });
  const err = el('p', { className: 'err', role: 'alert' });
  const save = el('button', { className: 'btn', type: 'submit', textContent: 'Save' });
  const form = el('form', { className: 'evform' });
  if (appt) form.append(field('Who is it for', person), field('Doctor or office', doctor), field('Reason for the visit', reason));
  else form.append(field('What', title));
  form.append(field('Date', date));
  if (!appt) form.append(el('label', { className: 'check' }, allDay, 'All day'));
  form.append(times, field('Location', location_), field('Notes', notes), err, save);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    if (appt ? !(person.value.trim() || doctor.value.trim()) : !title.value.trim()) { err.textContent = appt ? 'Add who it is for or the doctor.' : 'Add a name for the event.'; return; }
    const isAll = !appt && allDay.checked;
    const s = new Date(date.value + 'T' + start.value), en = new Date(date.value + 'T' + end.value);
    if (!date.value || (!isAll && !(en > s))) { err.textContent = 'Check the date and times. The end has to be after the start.'; return; }
    save.disabled = true; save.textContent = 'Saving…';
    const body = { id: ev ? ev.id : '', kind, title: title.value, person: person.value, doctor: doctor.value, reason: reason.value, location: location_.value, notes: notes.value, allDay: isAll, date: date.value, start: isAll ? '' : s.toISOString(), end: isAll ? '' : en.toISOString() };
    try {
      const out = await api('cal.save', body);
      if (out.ok) { showEvents(listKind || kind); return; }
      if (out.error === 'auth') return;
      err.textContent = 'That did not save (' + out.error + '). Try again.';
    } catch (x) { err.textContent = 'That did not save. Check your signal and try again.'; }
    save.disabled = false; save.textContent = 'Save';
  });
  main.append(form);
  if (ev) {
    const del = el('button', { className: 'btn quiet', textContent: appt ? 'Delete appointment' : 'Delete event' });
    let armed = false;
    del.addEventListener('click', async () => {
      if (!armed) { armed = true; del.textContent = 'Tap again to delete'; return; }
      del.disabled = true; del.textContent = 'Deleting…';
      try {
        const out = await api('cal.delete', { id: ev.id });
        if (out.ok) { showEvents(listKind || kind); return; }
        if (out.error === 'auth') return;
        err.textContent = 'That did not delete (' + out.error + '). Try again.';
      } catch (x) { err.textContent = 'That did not delete. Check your signal and try again.'; }
      del.disabled = false; armed = false; del.textContent = appt ? 'Delete appointment' : 'Delete event';
    });
    main.append(del);
  }
}

function renderList() {
  const list = document.getElementById('list');
  const foot = document.getElementById('foot');
  if (!list) return;
  const sorted = [...items].sort((a, b) => a.done - b.done);
  list.replaceChildren(...sorted.map(it => {
    const box = el('input', { type: 'checkbox', checked: it.done, id: 'i' + it.id });
    box.addEventListener('change', () => change('grocery.toggle', it, { done: box.checked }, () => { it.done = box.checked; }));
    const label = el('label', { htmlFor: 'i' + it.id, textContent: it.item });
    const sub = it.pending ? 'Saving…' : [it.qty, it.addedBy].filter(Boolean).join(' · ');
    if (sub) label.append(el('small', { textContent: sub }));
    const del = el('button', { textContent: '×', ariaLabel: 'Remove ' + it.item });
    del.addEventListener('click', () => change('grocery.delete', it, {}, () => { items = items.filter(x => x !== it); }));
    return el('li', { className: (it.done ? 'done' : '') + (it.pending ? ' pending' : '') }, box, label, del);
  }));
  document.getElementById('empty').hidden = items.length > 0;
  foot.hidden = !items.some(i => i.done);
}

async function change(action, it, data, optimistic) {
  optimistic();
  renderList();
  try {
    const out = await api(action, Object.assign({ id: it.id }, data));
    if (out.ok) { items = merge(out.items); renderList(); } else { showErr(saveMsg(out)); refresh(); }
  } catch (e) { showErr('That change did not save. Check your signal and try again.'); refresh(); }
}

async function refresh() {
  if (view !== 'grocery' || !token) return;
  try {
    const out = await api('grocery.list');
    if (out.ok) { items = merge(out.items); renderList(); }
  } catch (e) {}
}

function merge(list) { return list.concat(items.filter(i => i.pending)); }
function showErr(msg) { const e = document.getElementById('gerr'); if (e) e.textContent = msg; }
function saveMsg(out) { return 'That did not save (' + (out.error || 'unknown') + '). Try again.'; }

function showGrocery() {
  setView('grocery', 'Grocery list');
  const item = el('input', { placeholder: 'Add an item', required: true, maxLength: 120, ariaLabel: 'Item' });
  const qty = el('input', { placeholder: 'Qty', maxLength: 40, ariaLabel: 'Quantity' });
  const add = el('button', { className: 'btn', type: 'submit', textContent: 'Add' });
  const form = el('form', { className: 'add' }, item, qty, add);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = item.value.trim();
    if (!text) return;
    const payload = { item: text, qty: qty.value.trim(), addedBy: store.get('name') || '' };
    item.value = ''; qty.value = ''; item.focus();
    const temp = { id: 'new' + Date.now(), item: text, qty: payload.qty, addedBy: payload.addedBy, done: false, pending: true };
    items.push(temp);
    showErr('');
    renderList();
    let failed = '';
    try {
      const out = await api('grocery.add', payload);
      items = items.filter(i => i !== temp);
      if (out.ok) items = merge(out.items); else failed = saveMsg(out);
    } catch (e) {
      items = items.filter(i => i !== temp);
      failed = text + ' did not save. Check your signal and add it again.';
    }
    if (failed) { showErr(failed); item.value = item.value || text; qty.value = qty.value || payload.qty; }
    renderList();
  });
  const clear = el('button', { className: 'btn quiet', textContent: 'Clear checked items' });
  clear.addEventListener('click', async () => {
    items = items.filter(i => !i.done);
    renderList();
    try {
      const out = await api('grocery.clearDone');
      if (out.ok) { items = merge(out.items); renderList(); } else { showErr(saveMsg(out)); refresh(); }
    } catch (e) { showErr('That change did not save. Check your signal and try again.'); refresh(); }
  });
  main.append(form, el('p', { className: 'err', id: 'gerr', role: 'alert' }), el('ul', { id: 'list' }),
    el('p', { className: 'note', id: 'empty', textContent: 'The list is empty.', hidden: items.length > 0 }),
    el('div', { id: 'foot', hidden: true }, clear));
  renderList();
  refresh();
}

backBtn.addEventListener('click', () => { if (view === 'hub' && hubBack) hubBack(); else if (view === 'form') showEvents(listKind || 'event'); else showHome(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(refresh, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
token ? showHome() : showGate();
</script>
</body>
</html>
