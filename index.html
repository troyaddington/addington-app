<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addington App</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#23433b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Addington">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#f6f1e7; --card:#fffdf8; --ink:#1f2a27; --muted:#68746f; --line:#e3dccd; --brand:#23433b; --accent:#c8693f; --danger:#a63d2f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:var(--brand); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font:600 21px/1.2 Georgia, "Times New Roman", serif; margin:0; flex:1; }
  header button { background:none; border:0; color:#fff; font:inherit; padding:6px 0; min-height:44px; cursor:pointer; }
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 14px; text-align:left; font:inherit; color:inherit; min-height:112px; cursor:pointer; }
  .tile b { display:block; font-size:18px; margin-bottom:4px; }
  .tile span { color:var(--muted); font-size:14px; }
  .tile[disabled] { opacity:.6; cursor:default; }
  form.add { display:grid; grid-template-columns:1fr 84px 56px; gap:8px; margin-bottom:14px; }
  input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); min-height:48px; }
  .btn { font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; padding:12px 16px; min-height:48px; cursor:pointer; }
  .btn.quiet { background:none; color:var(--danger); font-weight:500; padding:10px 0; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  ul:empty { display:none; }
  li { display:flex; align-items:center; gap:10px; padding:4px 6px 4px 14px; border-top:1px solid var(--line); min-height:56px; }
  li:first-child { border-top:0; }
  li input[type=checkbox] { width:24px; height:24px; min-height:0; flex:none; accent-color:var(--brand); }
  li label { flex:1; padding:10px 0; cursor:pointer; overflow-wrap:anywhere; }
  li small { display:block; color:var(--muted); font-size:13px; }
  li.done label { color:var(--muted); text-decoration:line-through; }
  li button { background:none; border:0; color:var(--muted); font-size:22px; width:44px; height:44px; cursor:pointer; }
  .gate { max-width:360px; margin:9vh auto 0; display:grid; gap:12px; }
  .gate h2 { font:600 26px/1.2 Georgia, "Times New Roman", serif; margin:0; color:var(--brand); }
  .gate p { margin:0; color:var(--muted); }
  .note { color:var(--muted); text-align:center; padding:24px 8px; }
  .err { color:var(--danger); min-height:1.4em; font-size:15px; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Back to home">‹ Home</button>
  <h1 id="title">Addington App</h1>
</header>
<main id="main"></main>

<script>
// Paste the deployed Apps Script web app URL here.
const API_URL = 'https://script.google.com/macros/s/AKfycbw5WMXFqKbHFmhxtV2MFHCqTr8zJO94zdutdqH5eBPlKNISalXWB3PEdq12bFh_5U5PXw/exec';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let token = store.get('token');
let items = [];
let view = 'home';
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const titleEl = document.getElementById('title');

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token }, data || {}))
  });
  const out = await res.json();
  if (!out.ok && out.error === 'auth') { store.del('token'); token = null; showGate(); }
  return out;
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  kids.forEach(k => n.append(k));
  return n;
}

function setView(name, title) {
  view = name;
  titleEl.textContent = title;
  backBtn.hidden = name === 'home' || name === 'gate';
  main.replaceChildren();
}

async function showGate() {
  setView('gate', 'Addington App');
  const note = el('p', { className: 'note', textContent: 'Loading…' });
  main.append(note);
  let hasPasscode = true;
  try { hasPasscode = (await api('status')).hasPasscode; }
  catch (e) { note.textContent = 'Could not connect. Check your signal and try again.'; return; }
  main.replaceChildren();

  const name = el('input', { placeholder: 'Your first name', autocomplete: 'given-name', value: store.get('name') || '', required: true });
  const pass = el('input', { type: 'password', placeholder: hasPasscode ? 'Family passcode' : 'Choose a family passcode', autocomplete: 'off', required: true, minLength: 6 });
  const err = el('p', { className: 'err' });
  const btn = el('button', { className: 'btn', type: 'submit', textContent: hasPasscode ? 'Open' : 'Create passcode' });
  const form = el('form', { className: 'gate' },
    el('h2', { textContent: hasPasscode ? 'Welcome home' : 'Set up your family app' }),
    el('p', { textContent: hasPasscode ? 'Enter the family passcode.' : 'Pick a passcode of at least 6 characters. Everyone in the family will use it.' }),
    name, pass, err, btn);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const out = await api(hasPasscode ? 'login' : 'setup', { passcode: pass.value });
      if (out.ok) {
        token = out.token;
        store.set('token', token);
        store.set('name', name.value.trim());
        showHome();
        return;
      }
      err.textContent = { wrong: 'That passcode is not right.', locked: 'Too many tries. Wait 15 minutes.', too_short: 'Use at least 6 characters.', already_set: 'A passcode already exists. Reload and enter it.' }[out.error] || 'Something went wrong. Try again.';
    } catch (e) { err.textContent = 'Could not connect. Try again.'; }
    btn.disabled = false;
  });
  main.append(form);
}

function showHome() {
  setView('home', 'Addington App');
  const tile = (t, s, fn) => el('button', { className: 'tile', disabled: !fn, onclick: fn || null }, el('b', { textContent: t }), el('span', { textContent: s }));
  main.append(el('div', { className: 'tiles' },
    tile('Grocery list', 'Shared with everyone', showGrocery),
    tile('Calendar', 'Coming next'),
    tile('Appointments', 'Coming next'),
    tile('Reminders', 'Coming next')));
}

function renderList() {
  const list = document.getElementById('list');
  const foot = document.getElementById('foot');
  if (!list) return;
  const sorted = [...items].sort((a, b) => a.done - b.done);
  list.replaceChildren(...sorted.map(it => {
    const box = el('input', { type: 'checkbox', checked: it.done, id: 'i' + it.id });
    box.addEventListener('change', () => change('grocery.toggle', it, { done: box.checked }, () => { it.done = box.checked; }));
    const label = el('label', { htmlFor: 'i' + it.id, textContent: it.item });
    const sub = [it.qty, it.addedBy].filter(Boolean).join(' · ');
    if (sub) label.append(el('small', { textContent: sub }));
    const del = el('button', { textContent: '×', ariaLabel: 'Remove ' + it.item });
    del.addEventListener('click', () => change('grocery.delete', it, {}, () => { items = items.filter(x => x !== it); }));
    return el('li', { className: it.done ? 'done' : '' }, box, label, del);
  }));
  document.getElementById('empty').hidden = items.length > 0;
  foot.hidden = !items.some(i => i.done);
}

async function change(action, it, data, optimistic) {
  optimistic();
  renderList();
  try {
    const out = await api(action, Object.assign({ id: it.id }, data));
    if (out.ok) { items = out.items; renderList(); }
  } catch (e) { refresh(); }
}

async function refresh() {
  if (view !== 'grocery' || !token) return;
  try {
    const out = await api('grocery.list');
    if (out.ok) { items = out.items; renderList(); }
  } catch (e) {}
}

function showGrocery() {
  setView('grocery', 'Grocery list');
  const item = el('input', { placeholder: 'Add an item', required: true, maxLength: 120, ariaLabel: 'Item' });
  const qty = el('input', { placeholder: 'Qty', maxLength: 40, ariaLabel: 'Quantity' });
  const add = el('button', { className: 'btn', type: 'submit', textContent: 'Add' });
  const form = el('form', { className: 'add' }, item, qty, add);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = item.value.trim();
    if (!text) return;
    const payload = { item: text, qty: qty.value.trim(), addedBy: store.get('name') || '' };
    item.value = ''; qty.value = ''; item.focus();
    items.push({ id: 'new' + Date.now(), item: text, qty: payload.qty, addedBy: payload.addedBy, done: false });
    renderList();
    try {
      const out = await api('grocery.add', payload);
      if (out.ok) { items = out.items; renderList(); }
    } catch (e) { refresh(); }
  });
  const clear = el('button', { className: 'btn quiet', textContent: 'Clear checked items' });
  clear.addEventListener('click', async () => {
    items = items.filter(i => !i.done);
    renderList();
    try {
      const out = await api('grocery.clearDone');
      if (out.ok) { items = out.items; renderList(); }
    } catch (e) { refresh(); }
  });
  main.append(form, el('ul', { id: 'list' }),
    el('p', { className: 'note', id: 'empty', textContent: 'The list is empty.', hidden: items.length > 0 }),
    el('div', { id: 'foot', hidden: true }, clear));
  renderList();
  refresh();
}

backBtn.addEventListener('click', showHome);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(refresh, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
token ? showHome() : showGate();
</script>
</body>
</html>
